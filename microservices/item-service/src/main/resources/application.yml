server:
  port: 8083

spring:
  application:
    name: item-service

  config:
    import: configserver:http://localhost:9091

  cloud:
    config:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
