server:
  port: 8085


spring:
  application:
    name: chat-service

  config:
    import: optional:configserver:http://localhost:9091

  datasource:
    url: jdbc:postgresql://localhost:5432/returnx_chat
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect



eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka



management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always



logging:
  level:
    root: INFO
    com.returnX.chat_service: DEBUG
    org.springframework.security: INFO



jwt:
  secret: 8T4qvY7nLm2ZxP9kHs6RwQ3eFd8BaJ5Nc1UvX0MgKe7TyI4OpLs9Dh2QrW6XeFa

